<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #12141c;
  --panel: #1b1f2b;
  --panel-2: #232838;
  --line: #333a50;
  --ink: #ece6d3;
  --dim: #9097ad;
  --accent: #f2c14e;
  --good: #7bd389;
  --bad: #ef6f6c;
  --blue: #7fb2ff;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: "VT323", ui-monospace, Menlo, monospace; font-size: 20px; line-height: 1.15; }
header {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
  padding: 10px 16px; border-bottom: 2px solid var(--line); background: var(--panel);
}
.logo { display: flex; align-items: baseline; gap: 10px; }
.logo b { font-size: 30px; letter-spacing: 2px; color: var(--ink); }
.logo span { color: var(--dim); }
.controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-left: auto; }
.group { display: flex; gap: 2px; border: 2px solid var(--line); background: var(--bg); }
button, select {
  font: inherit; color: var(--ink); background: transparent; border: 0; padding: 2px 10px; cursor: pointer;
}
button:hover { background: var(--panel-2); }
button[aria-pressed="true"] { background: var(--accent); color: #1a1a1a; }
select { background: var(--bg); border: 2px solid var(--line); padding: 1px 6px; }
#clock { color: var(--accent); min-width: 15ch; text-align: right; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 0; min-height: calc(100vh - 60px); }
.stage { position: relative; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
canvas#office {
  image-rendering: pixelated; image-rendering: crisp-edges;
  width: 100%; max-width: 1440px; aspect-ratio: 3 / 2; display: block;
  border: 4px solid #000; box-shadow: 0 0 0 2px var(--line), 0 12px 40px rgba(0,0,0,.5);
  background: #000;
}
#banner { color: var(--dim); min-height: 1.2em; text-align: center; }
#tip {
  position: fixed; pointer-events: none; z-index: 10; display: none; max-width: 280px;
  background: #fffbe8; color: #1a1a1a; border: 2px solid #000; padding: 6px 8px; box-shadow: 4px 4px 0 rgba(0,0,0,.4);
}
#tip b { display: block; font-size: 22px; }
aside { border-left: 2px solid var(--line); background: var(--panel); overflow: auto; max-height: calc(100vh - 60px); }
aside section { padding: 12px 14px; border-bottom: 2px solid var(--line); }
aside h2 { margin: 0 0 8px; font-size: 22px; font-weight: normal; color: var(--accent); letter-spacing: 1px; }
.who { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.who div { display: flex; gap: 6px; align-items: center; cursor: default; padding: 2px; }
.who div:hover { background: var(--panel-2); }
.who canvas { image-rendering: pixelated; width: 28px; height: 48px; flex: none; }
.who small { display: block; color: var(--dim); font-size: 16px; line-height: 1; }
.tickets { display: flex; flex-direction: column; gap: 6px; }
.ticket { background: var(--panel-2); border-left: 4px solid var(--blue); padding: 4px 8px; cursor: pointer; }
.ticket.waiting { border-color: var(--accent); }
.ticket.bad { border-color: var(--bad); }
.ticket.done { border-color: var(--good); opacity: .75; }
.ticket.focus { outline: 2px solid var(--accent); }
.ticket .k { color: var(--accent); }
.ticket .t { color: var(--ink); }
.ticket .w { color: var(--dim); font-size: 17px; }
#log { list-style: none; margin: 0; padding: 0; font-size: 17px; }
#log li { padding: 1px 0; color: var(--ink); }
#log li time { color: var(--dim); margin-right: 6px; }
#log li.minor { color: var(--dim); }
.empty { color: var(--dim); }
@media (max-width: 900px) {
  main { grid-template-columns: 1fr; }
  aside { border-left: 0; border-top: 2px solid var(--line); max-height: none; }
  .stage { padding: 8px 0; }
  canvas#office { border-width: 2px; }
}
</style>
</head>
<body>
<header>
  <div class="logo"><b>DUNDER MIFFLIN</b><span>Scranton branch · coordinator office</span></div>
  <div class="controls">
    <div class="group" role="group" aria-label="Mode">
      <button data-mode="live">Live</button>
      <button data-mode="replay">Replay</button>
      <button data-mode="demo">Demo</button>
    </div>
    <select id="replayTicket" title="Replay one ticket or all"><option value="">All tickets</option></select>
    <div class="group" role="group" aria-label="Speed">
      <button data-speed="1">1x</button>
      <button data-speed="2">2x</button>
      <button data-speed="4">4x</button>
      <button data-speed="8">8x</button>
    </div>
    <div class="group">
      <button id="namesBtn" aria-pressed="true">Names</button>
      <button id="quipsBtn" aria-pressed="true">Banter</button>
    </div>
    <span id="clock"></span>
  </div>
</header>
<main>
  <div class="stage">
    <canvas id="office" width="480" height="320" aria-label="Animated office: the coordinator and its stages at work"></canvas>
    <div id="banner"></div>
  </div>
  <aside>
    <section><h2>Tickets</h2><div class="tickets" id="tickets"><span class="empty">No tickets yet.</span></div></section>
    <section><h2>Who's who</h2><div class="who" id="who"></div></section>
    <section><h2>What just happened</h2><ul id="log"></ul></section>
  </aside>
</main>
<div id="tip"></div>
<script>
'use strict';
// ============================================================================ basics
const W = 480, H = 320, T = 16;
const cv = document.getElementById('office');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const $ = (s) => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (xs) => xs[Math.floor(Math.random() * xs.length)];

// ============================================================================ 3x5 pixel font
const FONT = {};
function G(chars, rows) { FONT[chars] = rows.split(' ').map((r) => [...r].map((c) => c === '#')); }
G('A', '.#. #.# ### #.# #.#'); G('B', '##. #.# ##. #.# ##.'); G('C', '.## #.. #.. #.. .##');
G('D', '##. #.# #.# #.# ##.'); G('E', '### #.. ##. #.. ###'); G('F', '### #.. ##. #.. #..');
G('G', '.## #.. #.# #.# .##'); G('H', '#.# #.# ### #.# #.#'); G('I', '### .#. .#. .#. ###');
G('J', '..# ..# ..# #.# .#.'); G('K', '#.# #.# ##. #.# #.#'); G('L', '#.. #.. #.. #.. ###');
G('M', '#.# ### #.# #.# #.#'); G('N', '##. #.# #.# #.# #.#'); G('O', '.#. #.# #.# #.# .#.');
G('P', '##. #.# ##. #.. #..'); G('Q', '.#. #.# #.# ##. .##'); G('R', '##. #.# ##. #.# #.#');
G('S', '.## #.. .#. ..# ##.'); G('T', '### .#. .#. .#. .#.'); G('U', '#.# #.# #.# #.# ###');
G('V', '#.# #.# #.# #.# .#.'); G('W', '#.# #.# #.# ### #.#'); G('X', '#.# #.# .#. #.# #.#');
G('Y', '#.# #.# .#. .#. .#.'); G('Z', '### ..# .#. #.. ###');
G('0', '### #.# #.# #.# ###'); G('1', '.#. ##. .#. .#. ###'); G('2', '##. ..# .#. #.. ###');
G('3', '##. ..# .#. ..# ##.'); G('4', '#.# #.# ### ..# ..#'); G('5', '### #.. ##. ..# ##.');
G('6', '.## #.. ### #.# ###'); G('7', '### ..# .#. .#. .#.'); G('8', '### #.# ### #.# ###');
G('9', '### #.# ### ..# ##.');
G('.', '... ... ... ... .#.'); G(',', '... ... ... .#. #..'); G('!', '.#. .#. .#. ... .#.');
G('?', '##. ..# .#. ... .#.'); G("'", '.#. .#. ... ... ...'); G('"', '#.# #.# ... ... ...');
G('-', '... ... ### ... ...'); G(':', '... .#. ... .#. ...'); G('#', '#.# ### #.# ### #.#');
G('/', '..# ..# .#. #.. #..'); G('(', '.#. #.. #.. #.. .#.'); G(')', '.#. ..# ..# ..# .#.');
G('+', '... .#. ### .#. ...'); G('&', '.#. #.# .#. #.# .##'); G('*', '... #.# .#. #.# ...');
G('_', '... ... ... ... ###'); G('%', '#.. ..# .#. #.. ..#');
function clean(s) { return String(s).toUpperCase().replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[—–]/g, '-'); }
function textW(s) { s = clean(s); return s.length ? s.length * 4 - 1 : 0; }
function drawText(c, s, x, y, col) {
  c.fillStyle = col;
  let cx = Math.round(x); y = Math.round(y);
  for (const ch of clean(s)) {
    const g = FONT[ch];
    if (g) for (let r = 0; r < 5; r++) for (let k = 0; k < 3; k++) if (g[r][k]) c.fillRect(cx + k, y + r, 1, 1);
    cx += 4;
  }
}
function drawTextOutlined(c, s, x, y, col, out = '#111') {
  for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) drawText(c, s, x + dx, y + dy, out);
  drawText(c, s, x, y, col);
}
function wrap(s, max) {
  const lines = []; let line = '';
  for (const word of clean(s).split(/\s+/)) {
    if (!line) line = word;
    else if ((line + ' ' + word).length <= max) line += ' ' + word;
    else { lines.push(line); line = word; }
  }
  if (line) lines.push(line);
  return lines.slice(0, 4);
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = (v) => Math.max(0, Math.min(255, v + amt));
  return '#' + [f(n >> 16), f((n >> 8) & 255), f(n & 255)].map((v) => v.toString(16).padStart(2, '0')).join('');
}

// ============================================================================ the floor plan
// # wall, g glass, D door, S stairs; floors: m Michael, c conference, k kitchen, a annex,
// r reception, . bullpen (sales), A accounting, w warehouse.
const MAP = [
  '##############################',
  '#mmmmmg#cccccccc#kkkkkk#aaaaa#',
  '#mmmmmg#cccccccc#kkkkkk#aaaaa#',
  '#mmmmmg#cccccccc#kkkkkk#aaaaa#',
  '#mmmmmg#cccccccc#kkkkkk#aaaaa#',
  '#ggDgg####D#######D######D####',
  '#rrrrrr...............AAAAAAA#',
  '#rrrrrr...............AAAAAAA#',
  '#rrrrrr...............AAAAAAA#',
  '#rrrrrr...............AAAAAAA#',
  '#rrrrrr...............AAAAAAA#',
  'Drrrrrr...............AAAAAAA#',
  '#rrrrrr...............AAAAAAA#',
  '#rrrrrr...............AAAAAAA#',
  '#####################SS#######',
  '#wwwwwwwwwwwwwwwwwwwwwwwwwwww#',
  '#wwwwwwwwwwwwwwwwwwwwwwwwwwww#',
  '#wwwwwwwwwwwwwwwwwwwwwwwwwwww#',
  '#wwwwwwwwwwwwwwwwwwwwwwwwwwww#',
  '##############################',
];
const blocked = new Set();
function block(x, y, w = 1, h = 1) { for (let i = 0; i < w; i++) for (let j = 0; j < h; j++) blocked.add(`${x + i},${y + j}`); }
function walkable(x, y) {
  if (x < 0 || y < 0 || x >= 30 || y >= 20) return false;
  const c = MAP[y][x];
  return c !== '#' && c !== 'g' && !blocked.has(`${x},${y}`);
}
function findPath(sx, sy, tx, ty) {
  if (sx === tx && sy === ty) return [];
  const key = (x, y) => x + y * 30;
  const prev = new Map([[key(sx, sy), -1]]);
  const queue = [[sx, sy]];
  while (queue.length) {
    const [x, y] = queue.shift();
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy, k = key(nx, ny);
      if (prev.has(k)) continue;
      if (!(nx === tx && ny === ty) && !walkable(nx, ny)) continue;
      prev.set(k, key(x, y));
      if (nx === tx && ny === ty) {
        const path = []; let cur = k;
        while (cur !== key(sx, sy)) { path.unshift([cur % 30, Math.floor(cur / 30)]); cur = prev.get(cur); }
        return path;
      }
      queue.push([nx, ny]);
    }
  }
  return null;
}

// Places people walk to.
const SPOT = {
  door: [0, 11], tray: [5, 10], conference: [11, 4], hr: [27, 4], truck: [24, 16],
  kitchen: [[17, 2], [18, 2], [19, 2], [20, 2], [21, 2], [22, 2], [17, 3], [18, 3], [21, 3], [22, 3],
            [17, 4], [18, 4], [19, 4], [20, 4], [21, 4], [22, 4]],
};

// ============================================================================ the cast
const SKIN = { light: '#f1c7a3', fair: '#f6d8bf', tan: '#c98e5e', brown: '#8d5a3a', deep: '#6a4128' };
const CAST = {
  michael: { tag: 'The coordinator', name: 'Michael', seat: [3, 2], role: 'Regional Manager. He is the coordinator: picks up every ticket and hands it to the right person.',
    skin: SKIN.light, hair: '#3a2a1e', style: 'side', shirt: '#f2f2ee', jacket: '#2e3a58', tie: '#9c2424', pants: '#2e3a58', collar: '#ffffff' },
  pam: { tag: 'Jira, new tickets', name: 'Pam', seat: [3, 8], role: 'Reception, i.e. Jira. New tickets land in her tray and she keeps every Jira status up to date.',
    skin: SKIN.light, hair: '#b8653a', style: 'pony', shirt: '#f4efe6', cardigan: '#e59ab3', pants: '#6a6f8c', skirt: true },
  jim: { tag: 'Refinement', name: 'Jim', seat: [9, 7], role: 'Sales. Refinement: turns a ticket into a specification.', tall: true,
    skin: SKIN.light, hair: '#7a5230', style: 'floppy', shirt: '#e4ecf4', tie: '#2c3e5e', tieLoose: true, pants: '#3a3f4c', collar: '#ffffff' },
  dwight: { tag: 'Planning', name: 'Dwight', seat: [12, 7], role: 'Assistant (to the) Regional Manager. Planning.',
    skin: SKIN.light, hair: '#6a4a2b', style: 'part', glasses: true, shirt: '#d6ae35', shortSleeve: true, tie: '#5a3b1e', pants: '#4f3d2a' },
  ryan: { tag: 'Development', name: 'Ryan', seat: [15, 7], role: 'Development: writes the code. Each developer takes one ticket at a time.',
    skin: SKIN.light, hair: '#1b1b1b', style: 'spiky', shirt: '#ffffff', jacket: '#25252b', pants: '#25252b' },
  andy: { tag: 'Development', name: 'Andy', seat: [9, 10], role: 'Development: writes the code. Each developer takes one ticket at a time.',
    skin: SKIN.light, hair: '#a97c4a', style: 'short', shirt: '#9e1b32', collar: '#ffffff', pants: '#c2a878' },
  stanley: { tag: 'Development', name: 'Stanley', seat: [12, 10], role: 'Development: writes the code. Each developer takes one ticket at a time.',
    skin: SKIN.deep, hair: '#3a3a3a', style: 'bald', stache: '#2a2a2a', shirt: '#cdb98e', tie: '#6a3a2a', collar: '#cdb98e', pants: '#3a3a3a' },
  phyllis: { tag: 'Development', name: 'Phyllis', seat: [15, 10], role: 'Development: writes the code. Each developer takes one ticket at a time.',
    skin: SKIN.light, hair: '#cbb48c', style: 'curly', shirt: '#5f8d62', floral: '#e9d36b', pants: '#4a4a5a' },
  oscar: { tag: 'Verification', name: 'Oscar', seat: [23, 7], role: 'Accounting. Verification: checks the work against the specification.',
    skin: SKIN.tan, hair: '#1d1d1d', style: 'short', stache: '#1d1d1d', shirt: '#6f6380', collar: '#ffffff', pants: '#3a3a3a' },
  angela: { tag: 'Reviews findings', name: 'Angela', seat: [26, 7], role: 'Head of Accounting. Reviews the verification findings, harshly. Her cat is not involved.', short: true,
    skin: SKIN.fair, hair: '#e8d27a', style: 'bun', shirt: '#ebdfc4', collar: '#ffffff', pants: '#6a5a7a', skirt: true },
  kevin: { tag: 'Runs the checks', name: 'Kevin', seat: [23, 10], role: 'Accounting. Runs the checks: tests, lint and CI. And his chili.', wide: true,
    skin: SKIN.light, hair: '#5a4632', style: 'receding', shirt: '#a3bcd8', tie: '#3a4a6a', collar: '#ffffff', pants: '#4a4f5a' },
  creed: { tag: 'Quality Assurance', name: 'Creed', seat: [26, 10], role: 'Quality Assurance. Nobody is sure what he does.',
    skin: SKIN.light, hair: '#d9d9d9', style: 'messy', shirt: '#e8e2d2', cardigan: '#7d7f68', pants: '#5a5a4a' },
  toby: { tag: 'Blocked and failed', name: 'Toby', seat: [27, 2], role: 'HR, in the annex. Blocked and failed tickets end up on his desk. Michael hates that.',
    skin: SKIN.light, hair: '#7a6a5a', style: 'thin', shirt: '#8b9aa8', collar: '#ffffff', pants: '#4a4a4a' },
  darryl: { tag: 'Shipping', name: 'Darryl', seat: [18, 16], role: 'Warehouse. Loads the truck when a ticket ships.',
    skin: SKIN.brown, hair: '#151515', style: 'buzz', beard: '#151515', shirt: '#3d5a80', vest: '#d4e02a', pants: '#2f3a4a' },
};
const STAGE_WORKER = { refinement: 'jim', planning: 'dwight', verification: 'oscar', resolution: 'toby' };
const DEV_POOL = ['ryan', 'andy', 'stanley', 'phyllis'];
const STAGE_NAME = { refinement: 'refinement', planning: 'planning', development: 'development',
  verification: 'verification', resolution: 'resolution' };

// Desks: two tiles in front of (below) each seat; the person sits behind it, facing you.
for (const [id, d] of Object.entries(CAST)) {
  if (id === 'pam') continue;
  const [sx, sy] = d.seat;
  block(sx - 1, sy + 1, 2, 1);
}
block(1, 9, 4, 1);              // reception counter
block(9, 2, 6, 2);              // conference table
block(17, 1, 6, 1);             // kitchen counter
block(19, 3, 2, 1);             // kitchen table
block(24, 1);                   // annex filing cabinet
block(18, 7, 2, 1); block(20, 7); // copier, water cooler
block(27, 8);                   // Angela's cat
block(1, 15, 10, 1);            // warehouse shelves
block(13, 17, 2, 1);            // forklift
block(25, 15, 4, 4);            // truck

// ============================================================================ drawing people
function drawPerson(c, d, fx, fy, o = {}) {
  const legLen = 5 + (d.tall ? 2 : 0) - (d.short ? 2 : 0);
  const h = 15 + legLen;
  const L = Math.round(fx) - 6, Tp = Math.round(fy) - h + 1;
  const P = (x, y, w, hh, col) => { c.fillStyle = col; c.fillRect(L + x, Tp + y, w, hh); };
  const back = o.dir === 'up';
  const ex = o.dir === 'left' ? -1 : o.dir === 'right' ? 1 : 0;
  const wide = d.wide ? 1 : 0;
  const tx = 2 - wide, tw = 8 + 2 * wide;
  const shoe = '#2a1f1a';
  if (!o.noShadow) { c.fillStyle = 'rgba(0,0,0,.28)'; c.fillRect(L + 2, Tp + h - 1, 8, 2); }
  // legs
  const walk = o.walking ? o.frame % 2 : -1;
  if (d.skirt) {
    P(2, 15, 8, 2, d.pants);
    const a = walk === 0 ? 1 : 0, b = walk === 1 ? 1 : 0;
    P(3, 17, 2, legLen - 3 - a, d.skin); P(7, 17, 2, legLen - 3 - b, d.skin);
    P(3, 15 + legLen - 1 - a, 2, 1, shoe); P(7, 15 + legLen - 1 - b, 2, 1, shoe);
  } else {
    const a = walk === 0 ? 1 : 0, b = walk === 1 ? 1 : 0;
    P(3, 15, 6, 1, d.pants);
    P(3, 15, 2, legLen - 1 - a, d.pants); P(7, 15, 2, legLen - 1 - b, d.pants);
    P(3, 15 + legLen - 1 - a, 2, 1, shoe); P(7, 15 + legLen - 1 - b, 2, 1, shoe);
  }
  // torso
  P(tx, 8, tw, 7, d.shirt);
  if (d.floral && !back) { for (const [x, y] of [[3, 9], [7, 10], [4, 12], [8, 13], [6, 8], [2, 11]]) P(x, y, 1, 1, d.floral); }
  if (back) {
    if (d.jacket) P(tx, 8, tw, 7, d.jacket);
    if (d.cardigan) P(tx, 8, tw, 7, d.cardigan);
    if (d.vest) { P(tx, 8, tw, 7, d.vest); P(tx, 12, tw, 1, '#e6e6e6'); }
  } else {
    if (d.collar) P(4, 8, 4, 1, d.collar);
    if (d.tie) {
      const off = d.tieLoose ? 1 : 0;
      P(5, 8 + off, 2, 1, shade(d.tie, -25)); P(5, 9 + off, 2, 4 - off, d.tie); P(5, 13, 2, 1, shade(d.tie, -25));
    }
    if (d.jacket) { P(tx, 8, 3, 7, d.jacket); P(tx + tw - 3, 8, 3, 7, d.jacket); }
    if (d.cardigan) { P(tx, 8, 3, 7, d.cardigan); P(tx + tw - 3, 8, 3, 7, d.cardigan); }
    if (d.vest) { P(tx, 8, 3, 7, d.vest); P(tx + tw - 3, 8, 3, 7, d.vest); P(tx, 12, 3, 1, '#e6e6e6'); P(tx + tw - 3, 12, 3, 1, '#e6e6e6'); }
  }
  P(tx, 14, tw, 1, shade(d.pants, -20)); // belt
  // arms
  const sleeve = d.jacket || d.cardigan || d.shirt;
  const ax1 = tx - 1, ax2 = tx + tw;
  if (o.typing && !back) {
    const f = o.frame % 2;
    P(ax1, 9, 1, 3, sleeve); P(ax2, 9, 1, 3, sleeve);
    P(ax1 + 1, 12 - f, 2, 1, d.skin); P(ax2 - 2, 11 + f, 2, 1, d.skin);
  } else if (o.carrying && !back) {
    P(ax1, 9, 1, 3, sleeve); P(ax2, 9, 1, 3, sleeve);
  } else {
    const len = d.shortSleeve ? 2 : 5;
    P(ax1, 9, 1, len, sleeve); P(ax2, 9, 1, len, sleeve);
    if (d.shortSleeve) { P(ax1, 11, 1, 3, d.skin); P(ax2, 11, 1, 3, d.skin); }
    P(ax1, 14, 1, 1, d.skin); P(ax2, 14, 1, 1, d.skin);
  }
  // head
  P(3, 1, 6, 6, d.skin); P(4, 7, 4, 1, d.skin);
  P(2, 3, 1, 2, d.skin); P(9, 3, 1, 2, d.skin);
  if (!back) {
    if (d.glasses) {

  }
  const Hc = d.hair;
  const styles = {
    side: [[3, 0, 6, 1], [2, 1, 8, 1], [2, 2, 4, 1], [2, 3, 1, 2], [9, 2, 1, 2]],
    part: [[3, 0, 6, 1], [2, 1, 3, 1], [6, 1, 4, 1], [2, 2, 3, 1], [7, 2, 3, 1], [2, 3, 1, 2], [9, 3, 1, 2]],
    floppy: [[3, -1, 6, 1], [2, 0, 8, 2], [2, 2, 5, 1], [2, 3, 1, 2], [9, 2, 1, 2]],
    pony: [[3, 0, 6, 1], [2, 1, 8, 1], [2, 2, 3, 1], [8, 2, 2, 1], [2, 3, 1, 4], [9, 3, 1, 4], [1, 4, 1, 3], [10, 4, 1, 3]],
    short: [[3, 0, 6, 1], [2, 1, 8, 1], [2, 2, 1, 2], [9, 2, 1, 2]],
    bald: [[2, 3, 1, 2], [9, 3, 1, 2]],
    curly: [[2, -1, 8, 1], [1, 0, 10, 2], [1, 2, 3, 1], [8, 2, 3, 1], [1, 3, 2, 4], [9, 3, 2, 4]],
    spiky: [[3, -1, 1, 1], [5, -2, 1, 2], [7, -1, 1, 1], [3, 0, 6, 1], [2, 1, 8, 1], [2, 2, 2, 1], [9, 2, 1, 1]],
    bun: [[4, -3, 4, 3], [3, 0, 6, 1], [2, 1, 8, 1], [2, 2, 1, 2], [9, 2, 1, 2]],
    receding: [[4, 0, 4, 1], [2, 1, 2, 2], [8, 1, 2, 2], [2, 3, 1, 1], [9, 3, 1, 1]],
    messy: [[2, 0, 2, 1], [5, -1, 2, 1], [8, 0, 2, 1], [1, 1, 3, 2], [8, 1, 3, 2], [2, 3, 1, 2], [9, 3, 1, 2]],
    buzz: [[3, 0, 6, 1], [2, 1, 8, 1], [2, 2, 1, 1], [9, 2, 1, 1]],
    thin: [[2, 1, 2, 1], [8, 1, 2, 1], [2, 2, 1, 2], [9, 2, 1, 2], [4, 0, 1, 1], [7, 0, 1, 1]],

  const bald = ['bald', 'receding', 'messy', 'thin'].includes(d.style);

function drawFolder(c, x, y, o = {}) {

// ============================================================================ simulation clock
let speed = 1, simNow = 0, timers = [], waiters = [], sceneGen = 0;
function sleep(ms) { return new Promise((r) => timers.push({ at: simNow + ms, fn: r })); }
function after(ms, fn) { timers.push({ at: simNow + ms, fn }); }
function waitUntil(cond, why = '') { return cond() ? Promise.resolve() : new Promise((r) => waiters.push({ cond, r, why })); }
function tickTimers() {
  const due = timers.filter((t) => simNow >= t.at);
  timers = timers.filter((t) => simNow < t.at);
  due.forEach((t) => t.fn());
  const ready = waiters.filter((w) => w.cond());
  waiters = waiters.filter((w) => !ready.includes(w));
  ready.forEach((w) => w.r());
}

// ============================================================================ actors
const WALK = 64; // px per second
const tileXY = ([tx, ty]) => [tx * T + 8, ty * T + 15];
class Actor {
  constructor(id, d) {
    this.id = id; this.d = d; this.name = d.name; this.home = d.seat;
    [this.x, this.y] = tileXY(d.seat);
    this.deliver = [d.seat[0], d.seat[1] + 2];
    this.path = []; this.dir = 'down'; this.frame = 0; this.ft = 0;
    this.q = Promise.resolve(); this.qlen = 0;
    this.working = new Set(); this.carry = null; this.bubble = null; this.hidden = false; this.onArrive = null;
  }
  get tile() { return [Math.floor(this.x / T), Math.floor((this.y - 1) / T)]; }
  get walking() { return this.path.length > 0; }
  get atHome() { const [x, y] = this.tile; return !this.walking && x === this.home[0] && y === this.home[1]; }
  enqueue(fn) {
    const gen = sceneGen; this.qlen++;
    this.q = this.q.then(() => (gen === sceneGen ? fn() : null)).catch((e) => console.error(e)).finally(() => { this.qlen--; });
    return this.q;
  }
  walkTo(target) {
    return new Promise((res) => {
      const [sx, sy] = this.tile;
      const p = findPath(sx, sy, target[0], target[1]);
      if (!p) { [this.x, this.y] = tileXY(target); res(); return; }
      this.path = p.map(tileXY);
      if (!this.path.length) { res(); return; }
      this.onArrive = res;
    });
  }
  goHome() { return this.walkTo(this.home); }
  say(text, ms = 3000) { if (!this.hidden) this.bubble = { text, until: simNow + ms }; }
  update(dt) {
    if (this.path.length) {
      const [nx, ny] = this.path[0];
      const dx = nx - this.x, dy = ny - this.y, dist = Math.hypot(dx, dy);
      const step = WALK * (1 + Math.min(Math.max(this.qlen - 1, 0), 4) * 0.35) * dt;
      if (dist <= step) {
        this.x = nx; this.y = ny; this.path.shift();
        if (!this.path.length) { this.dir = 'down'; const r = this.onArrive; this.onArrive = null; if (r) r(); }
      } else {
        this.x += (dx / dist) * step; this.y += (dy / dist) * step;
        this.dir = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'left' : 'right') : (dy < 0 ? 'up' : 'down');
      }
      this.ft += dt; if (this.ft > 0.16) { this.ft = 0; this.frame++; }
    } else if (this.working.size) {
      this.ft += dt; if (this.ft > 0.2) { this.ft = 0; this.frame++; }
    }
    if (this.bubble && simNow > this.bubble.until) this.bubble = null;
  }
  draw(c) {
    if (this.hidden) return null;
    const typing = this.working.size > 0 && this.atHome;
    return drawPerson(c, this.d, this.x, this.y, { dir: this.dir, walking: this.walking, frame: this.frame, typing, carrying: !!this.carry });
  }
}

function resetScene() {
  sceneGen++; timers = []; waiters = []; particles = []; planes = [];
  A = {}; for (const [id, d] of Object.entries(CAST)) A[id] = new Actor(id, d);
  tickets = new Map(); shipped = 0; breakTime = false;
  A.michael.hidden = true; A.michael.out = true;

function ticketOf(key) {

  if (!t) { t = { key, loc: { k: 'tray' }, stage: '', last: '', dev: null, seq: 0, open: new Set() }; tickets.set(key, t); }

}
function workerFor(t, stage) {

      t.dev = DEV_POOL.slice().sort((a, b) => load(a) - load(b))[0];

}

}

// ============================================================================ beats -> animation
// The longest to-do list in the office: replay and demo wait while it is long.
function backlog() { return Math.max(...Object.values(A).map((a) => a.qlen)); }
// Work on one ticket, in the order its beats arrived: Michael never takes a folder away
// before the person holding it has finished what they were asked to do with it.
function ticketTask(actor, t, fn) {
  const id = ++t.seq;
  t.open.add(id);
  return actor.enqueue(async () => { try { await fn(); } finally { t.open.delete(id); } });
}
function stageWorkerOf(t, b) { return workerFor(t, b.stage || t.stage); }

function animate(b) {
  if (b.kind === 'boss_in' && breakTime) animate({ kind: 'back' });
  if (b.kind === 'boss_in') return A.michael.enqueue(async () => {
    if (!A.michael.out) return;
    A.michael.out = false; A.michael.hidden = false; [A.michael.x, A.michael.y] = tileXY(SPOT.door);
    A.michael.say('Good morning, Dunder Mifflin!');
    await A.michael.goHome();
  });
  if (b.kind === 'boss_out') return A.michael.enqueue(async () => {
    if (A.michael.out) return;
    A.michael.say("I'm going home.");
    await A.michael.walkTo(SPOT.door);
    A.michael.hidden = true; A.michael.out = true;
  });
  if (b.kind === 'break') {
    breakTime = true;
    A.michael.say("Claude's out. Coffee break!");
    Object.values(A).forEach((a, i) => a.enqueue(async () => { if (!a.hidden) await a.walkTo(SPOT.kitchen[i % SPOT.kitchen.length]); }));
    return;
  }
  if (b.kind === 'back') {
    if (!breakTime) return;
    breakTime = false;
    A.michael.say('Back to work, people!');
    Object.values(A).forEach((a) => a.enqueue(async () => { if (!a.hidden) await a.goHome(); }));
    return;
  }
  const t = ticketOf(b.ticket);
  const k = b.ticket;
  switch (b.kind) {
    case 'arrive': {
      const fresh = !t.stage;
      t.stage = b.stage; t.last = 'arrive';
      const w = workerFor(t, b.stage);
      if (fresh) A.pam.say(`New ticket: ${k}!`);
      const m = A.michael;
      const before = t.seq;
      m.enqueue(async () => {
        if (m.out) { m.out = false; m.hidden = false; [m.x, m.y] = tileXY(SPOT.door); }
        await waitUntil(() => t.loc.k !== 'hand' && ![...t.open].some((id) => id <= before), `michael: ${k} free`);
        if (t.loc.k === 'desk' && t.loc.a === w.id) { m.say(`${w.name}, keep going on ${k}.`); return; }
        const from = pickupSpot(t);
        if (from) await m.walkTo(from);
        place(t, { k: 'hand', a: 'michael' });
        m.say((DISPATCH[b.stage] || DISPATCH.development)(k, w.name));
        await m.walkTo(w.deliver);
        place(t, { k: 'desk', a: w.id });
        w.say(pick(ACK[w.id] || ['On it.']));
        await m.goHome();
      });
      break;
    }
    case 'start': {
      t.last = 'start';
      const w = stageWorkerOf(t, b);
      ticketTask(w, t, async () => {
        await waitUntil(() => t.loc.k === 'desk' && t.loc.a === w.id, `${w.id}: ${k} on desk (${b.kind})`);
        if (!w.atHome) await w.goHome();
        w.working.add(k); t.startedAt = simNow;
      });
      break;
    }
    case 'publishing': { const w = stageWorkerOf(t, b); ticketTask(w, t, async () => w.say(`Writing up ${k}...`, 2200)); break; }
    case 'push': { const w = stageWorkerOf(t, b); ticketTask(w, t, async () => w.say('git push!', 1600)); break; }
    case 'pr': { const w = stageWorkerOf(t, b); ticketTask(w, t, async () => w.say(`Opened pull request ${b.number}.`)); break; }
    case 'candidate': { const w = stageWorkerOf(t, b); ticketTask(w, t, async () => w.say(`${k} build is ready.`)); break; }
    case 'checks': {
      const w = stageWorkerOf(t, b);
      A.kevin.enqueue(async () => {
        const spot = A.kevin.id === w.id ? null : w.deliver;
        if (spot) await A.kevin.walkTo(spot);
        A.kevin.say(`Running the numbers on ${k}...`);
        await sleep(1800);
        A.kevin.say('Checks done. Mmm.');
        await sleep(600);
        await A.kevin.goHome();
      });
      if (b.stage === 'verification') A.angela.say(`I'll be reviewing ${short(k)}.`, 2500);
      break;
    }
    case 'jira': A.pam.say(`Jira: ${k} is ${statusName(b.to)}.`, 2600); break;
    case 'comment': {
      const from = holderOf(t) || stageWorkerOf(t, b);
      planes.push({ x0: from.x, y0: from.y - 16, x1: A.pam.x, y1: A.pam.y - 14, t: 0, dur: 1100 });
      break;
    }
    case 'await': case 'done': case 'blocked': case 'failed': {
      t.last = b.kind;
      const w = stageWorkerOf(t, b);
      ticketTask(w, t, async () => {
        await waitUntil(() => t.loc.k === 'desk' && t.loc.a === w.id, `${w.id}: ${k} on desk (${b.kind})`);
        const left = (t.startedAt || 0) + 2500 - simNow;
        if (left > 0) await sleep(left);
        w.working.delete(k);
        place(t, { k: 'hand', a: w.id });
        if (b.kind === 'await') {
          w.say(DONE_LINE[b.stage] || 'Ready for review!');

          await w.walkTo(SPOT.truck);
          place(t, { k: 'shipped' }); shipped++;

          A.michael.say(`${k} shipped! That's what she said.`);
        } else {
          w.say(b.kind === 'failed' ? `${k} failed...` : `${k} is blocked.`);
          await w.walkTo(SPOT.hr);
          place(t, { k: 'hr' });
          A.toby.say(b.kind === 'failed' ? "I'll take a look." : "I'll hold on to it.");
          A.michael.say(b.kind === 'failed' ? 'NO! GOD! NO!' : 'Toby has it. Great.');
        }

    }

      break;
    }
    case 'open': {
      const w = stageWorkerOf(t, b);
      ticketTask(w, t, async () => { await waitUntil(() => t.loc.k !== 'hand'); w.say(`Still here if you have questions on ${short(k)}.`, 3500); });
      break;
    }
  }
}

// History applied without animation: where everything is now.
function applyInstant(b) {
  // A supervisor (re)start clears any wait for Claude, so it also ends a coffee break.
  if (b.kind === 'boss_in') { A.michael.out = false; breakTime = false; return; }
  if (b.kind === 'boss_out') { A.michael.out = true; return; }
  if (b.kind === 'break') { breakTime = true; return; }
  if (b.kind === 'back') { breakTime = false; return; }
  if (!b.ticket) return;
  const t = ticketOf(b.ticket);
  const w = () => workerFor(t, b.stage || t.stage);
  switch (b.kind) {
    case 'arrive': t.stage = b.stage; t.last = 'arrive'; Object.values(A).forEach((a) => a.working.delete(t.key)); place(t, { k: 'desk', a: w().id }); break;
    case 'start': t.last = 'start'; w().working.add(t.key); break;
    case 'await': t.last = 'await'; w().working.delete(t.key); place(t, { k: 'table' }); break;
    case 'done': t.last = 'done'; w().working.delete(t.key); place(t, { k: 'shipped' }); shipped++; break;
    case 'blocked': case 'failed': t.last = b.kind; w().working.delete(t.key); place(t, { k: 'hr' }); break;
    case 'interrupted': t.last = 'interrupted'; w().working.delete(t.key); break;
    case 'cancelled': t.last = 'cancelled'; Object.values(A).forEach((a) => a.working.delete(t.key)); place(t, { k: 'cancelled' }); break;
  }
}
function settleActors(michaelIn) {
  A.michael.out = !michaelIn; A.michael.hidden = !michaelIn;
  Object.values(A).forEach((a, i) => {
    a.path = []; a.carry = null;
    [a.x, a.y] = tileXY(breakTime ? SPOT.kitchen[i % SPOT.kitchen.length] : a.home);
  });
}

// ============================================================================ effects
function confetti(x, y) {
  const cols = ['#f2c14e', '#ef6f6c', '#7bd389', '#7fb2ff', '#ffffff'];
  for (let i = 0; i < 40; i++) particles.push({ x, y, vx: rand(-60, 60), vy: rand(-110, -30), life: rand(0.9, 1.6), col: pick(cols) });
}
function updateEffects(dt) {
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 160 * dt; p.life -= dt; }
  particles = particles.filter((p) => p.life > 0);
  for (const p of planes) p.t += dt * 1000;
  planes = planes.filter((p) => p.t < p.dur);
}
function scheduleBanter(gen) {
  after(rand(9000, 16000), () => {
    if (gen !== sceneGen) return;
    if (banter) {
      const idle = Object.values(A).filter((a) => !a.hidden && !a.walking && !a.bubble);
      if (idle.length) { const a = pick(idle); a.say(pick(BANTER[a.id]), 2600); }
    }
    scheduleBanter(gen);
  });
}

  if (!at) return '';
  const d = new Date(at);
  return d.toLocaleString(undefined, { weekday: 'short', hour: '2-digit', minute: '2-digit' });
}
function describe(b) {
  const t = b.ticket && tickets.get(b.ticket);
  const w = t ? (b.stage ? workerFor(t, b.stage) : null) : null;
  const k = b.ticket, who = w ? w.name : '';
  switch (b.kind) {
    case 'arrive': return `Michael hands ${k} to ${who} for ${STAGE_NAME[b.stage] || b.stage}`;
    case 'start': return `${who} starts on ${k}`;
    case 'await': return `${who} leaves ${k} in the conference room: your turn`;
    case 'done': return `${k} shipped!`;
    case 'blocked': return `${k} is blocked: sent to Toby`;
    case 'failed': return `${k} failed: sent to Toby`;
    case 'interrupted': return `${k} paused`;
    case 'cancelled': return `${k} was cancelled`;
    case 'jira': return `Pam moves ${k} to ${statusName(b.to)}`;
    case 'pr': return `${who} opens PR #${b.number} for ${k}`;
    case 'push': return `${who} pushes ${k}`;
    case 'checks': return `Kevin runs the checks on ${k}`;
    case 'comment': return `${who} comments on ${k}`;
    case 'publishing': return `${who} writes up ${k}`;
    case 'candidate': return `${k}: a new build is ready`;
    case 'open': return `${who} stays on for questions about ${k}`;
    case 'boss_in': return 'Michael arrives (coordinator started)';
    case 'boss_out': return 'Michael goes home (coordinator stopped)';
    case 'break': return 'Claude unavailable: coffee break';
    case 'back': return 'Claude is back: back to work';
  }
  return b.kind;
}
const MINOR = new Set(['comment', 'push', 'publishing', 'jira', 'candidate', 'start']);
function logBeat(b) {
  const li = document.createElement('li');
  if (MINOR.has(b.kind)) li.className = 'minor';
  const time = document.createElement('time'); time.textContent = fmtTime(b.at);
  li.append(time, document.createTextNode(describe(b)));
  logEl.prepend(li);
  while (logEl.children.length > 80) logEl.lastChild.remove();
  if (b.at) $('#clock').textContent = fmtTime(b.at);
}
setInterval(renderTickets, 600);
setInterval(() => { if (mode === 'live') $('#clock').textContent = new Date().toLocaleString(undefined, { weekday: 'short', hour: '2-digit', minute: '2-digit' }); }, 1000);

// tooltips
const tip = $('#tip');
cv.addEventListener('mousemove', (e) => {
  const r = cv.getBoundingClientRect();
  const mx = ((e.clientX - r.left) / r.width) * W, my = ((e.clientY - r.top) / r.height) * H;
  const hit = hoverables.slice().reverse().find(({ box }) => mx >= box.x && mx <= box.x + box.w && my >= box.y && my <= box.y + box.h);
  if (!hit) { tip.style.display = 'none'; return; }
  const a = hit.a;
  const jobs = [...tickets.values()].filter((t) => (t.loc.k === 'desk' || t.loc.k === 'hand') && t.loc.a === a.id);
  tip.innerHTML = '<b></b><div class="r"></div><div class="j"></div>';
  tip.querySelector('b').textContent = a.name;
  tip.querySelector('.r').textContent = a.d.role;
  tip.querySelector('.j').textContent = jobs.length ? 'Has: ' + jobs.map((t) => `${t.key}${meta.get(t.key)?.title ? ' (' + meta.get(t.key).title + ')' : ''}`).join(', ') : '';
  tip.style.display = 'block';
  tip.style.left = Math.min(window.innerWidth - 300, e.clientX + 14) + 'px';
  tip.style.top = e.clientY + 14 + 'px';
});
cv.addEventListener('mouseleave', () => { tip.style.display = 'none'; });

// ============================================================================ modes
let mode = null, source = null, journal = [], lastSeq = 0, server = false, stale = false;
function setPressed(sel, attr, val) { document.querySelectorAll(sel).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset[attr] === String(val)))); }
function banner(s) { $('#banner').textContent = s; }

function handle(b) { animate(b); logBeat(b); }

function startLive(state) {
  resetScene();
  stale = false;
  logEl.innerHTML = '';
  for (const b of state.beats) applyInstant(b);
  breakTime = state.supervisor.claude_unavailable;
  settleActors(state.supervisor.running);
  state.beats.slice(-25).forEach(logBeat);
  lastSeq = state.beats.length ? state.beats[state.beats.length - 1].seq : 0;
  source = new EventSource(`/api/events?after=${lastSeq}`);
  source.onmessage = (e) => {
    const data = JSON.parse(e.data);
    (data.tickets || []).forEach((t) => meta.set(t.key, t));
    for (const b of data.beats) {
      lastSeq = b.seq; journal.push(b);
      // A hidden tab does not animate; it catches up from the journal when you come back.
      if (document.hidden) { stale = true; logBeat(b); } else handle(b);
    }
  };
  banner(state.supervisor.running ? 'Live: watching the coordinator. New work animates as it happens.' : 'Live: the coordinator is not running. Start it with `coordinator`.');
}

function startReplay(only) {
  resetScene();
  logEl.innerHTML = '';
  const beats = journal.filter((b) => (only ? b.ticket === only : true));
  if (only) { A.michael.out = false; A.michael.hidden = false; [A.michael.x, A.michael.y] = tileXY(A.michael.home); }
  const gen = sceneGen;
  let i = 0;
  const next = async () => {
    if (gen !== sceneGen) return;
    if (i >= beats.length) { banner('Replay finished.'); return; }
    // Time stretches while the office catches up, so hand-offs never pile up.
    await waitUntil(() => gen !== sceneGen || backlog() <= 2, 'replay pacing');
    if (gen !== sceneGen) return;
    const b = beats[i++];
    handle(b);
    const n = beats[i];
    const gap = n ? (Date.parse(n.at) - Date.parse(b.at)) / 60 : 0; // a real minute plays in a second
    after(Math.max(0, Math.min(2500, gap)), next);
  };
  banner(`Replay: ${only || 'every ticket'} from the journal. A real minute plays in about a second.`);
  next();
}

const DEMO_TITLES = ['Add a "Starred only" filter', 'Search tasks by title', 'Rename the page heading',
  'Dark mode for the task list', 'Export tasks as CSV', 'Due dates on tasks', 'Keyboard shortcuts', 'Undo delete'];
const IN_PROGRESS = { refinement: 'refining', planning: 'planning', development: 'developing', verification: 'verifying' };
const REVIEW = { refinement: 'specification_review', planning: 'plan_review', development: 'ready_verification',
  verification: 'code_review' };
function startDemo() {
  resetScene();
  logEl.innerHTML = '';
  const gen = sceneGen;
  let n = 0, active = 0, pr = 40;
  const clock0 = Date.now();
  const emit = (b) => { if (gen !== sceneGen) return; b.at = new Date(clock0 + simNow * 30).toISOString(); handle(b); };
  emit({ kind: 'boss_in' });
  const run = async (key) => {
    active++;
    const stages = ['refinement', 'planning', 'development', 'verification'];
    for (let s = 0; s < stages.length; s++) {
      const stage = stages[s];
      await waitUntil(() => gen !== sceneGen || backlog() <= 2, 'demo pacing');
      emit({ kind: 'arrive', ticket: key, stage });
      await sleep(1200); emit({ kind: 'jira', ticket: key, stage, to: IN_PROGRESS[stage] });
      emit({ kind: 'start', ticket: key, stage });
      await sleep(rand(5000, 9000));
      if (stage === 'verification') { emit({ kind: 'checks', ticket: key, stage }); await sleep(3000); }
      if (Math.random() < 0.1 && s > 1) {
        emit({ kind: Math.random() < 0.5 ? 'failed' : 'blocked', ticket: key, stage });
        await sleep(rand(9000, 14000)); s--; continue;
      }
      emit({ kind: 'publishing', ticket: key, stage });
      emit({ kind: 'comment', ticket: key, stage });
      if (stage === 'development') { emit({ kind: 'push', ticket: key, stage }); await sleep(800); emit({ kind: 'pr', ticket: key, stage, number: ++pr }); }
      await sleep(1000);
      if (stage === 'verification') { emit({ kind: 'done', ticket: key, stage }); break; }
      emit({ kind: 'await', ticket: key, stage });
      emit({ kind: 'jira', ticket: key, stage, to: REVIEW[stage] });
      await sleep(rand(6000, 12000)); // you, reviewing
    }
    active--;
  };
  const spawn = () => {
    if (gen !== sceneGen) return;
    if (active < 4 && backlog() <= 2) { const key = `DEMO-${++n}`; meta.set(key, { title: DEMO_TITLES[(n - 1) % DEMO_TITLES.length] }); run(key); }
    after(rand(7000, 12000), spawn);
  };
  after(1500, spawn);
  banner('Demo: made-up tickets, so you can see every hand-off.');
}

function setMode(m) {
  if (source) { source.close(); source = null; }
  if ((m === 'live' || m === 'replay') && !server) m = 'demo';
  mode = m;
  setPressed('[data-mode]', 'mode', m);
  $('#replayTicket').style.display = m === 'replay' ? '' : 'none';
  if (m === 'live') fetch('/api/state').then((r) => r.json()).then((s) => { journal = s.beats; s.tickets.forEach((t) => meta.set(t.key, t)); startLive(s); });
  else if (m === 'replay') startReplay($('#replayTicket').value || null);
  else startDemo();
  const u = new URL(location.href); u.searchParams.set('mode', m); replaceUrl(u);
}
function replaceUrl(u) { try { window.history.replaceState(null, '', u); } catch (e) { /* file:// */ } }

document.querySelectorAll('[data-mode]').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));
document.querySelectorAll('[data-speed]').forEach((b) => b.addEventListener('click', () => { speed = Number(b.dataset.speed); setPressed('[data-speed]', 'speed', speed); }));
$('#replayTicket').addEventListener('change', () => setMode('replay'));
document.addEventListener('visibilitychange', () => { if (!document.hidden && mode === 'live' && stale) setMode('live'); });
$('#namesBtn').addEventListener('click', (e) => { showNames = !showNames; e.target.setAttribute('aria-pressed', String(showNames)); });
$('#quipsBtn').addEventListener('click', (e) => { banter = !banter; e.target.setAttribute('aria-pressed', String(banter)); });

drawBackground();
renderWho();
setPressed('[data-speed]', 'speed', 1);
resetScene();
requestAnimationFrame(loop);
const wanted = new URL(location.href).searchParams.get('mode');
fetch('/api/state').then((r) => (r.ok ? r.json() : Promise.reject(r))).then((s) => {
  server = true; journal = s.beats;
  s.tickets.forEach((t) => meta.set(t.key, t));
  const keys = [...new Set(s.beats.filter((b) => b.ticket).map((b) => b.ticket))];
  for (const k of keys) { const o = document.createElement('option'); o.value = k; o.textContent = `${k} ${meta.get(k)?.title || ''}`; $('#replayTicket').appendChild(o); }
  setMode(wanted || 'live');
}).catch(() => {
  document.querySelectorAll('[data-mode="live"],[data-mode="replay"]').forEach((b) => { b.disabled = true; b.title = 'Needs `coordinator office`'; });
  setMode('demo');
});
</script>
