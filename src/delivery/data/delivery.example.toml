# delivery local configuration (the only file a developer edits)
#
# `coordinator setup` (the same as `delivery setup`) asks a few questions and fills this in; or
# copy it with `delivery init --config ./delivery.local.toml` and fill in the values yourself.
# A team can share everything except identity, email and local folders in a project file: see
# `project` below.
# Keep this file out of version control. It must never contain passwords or tokens:
# secrets are referenced by environment variable name only.
#
# Relative paths are resolved against the directory containing THIS file.
# There is no setting for the number of concurrent sessions: one supervisor runs
# every eligible ticket assigned to you, each in its own isolated session.

config_version = 1
# A shared project file from your team (`delivery project export` writes one). Its settings
# apply first and this file's values win. Then this file only needs [identity], jira.email,
# [repository] checkout_path and worktree_root, and [runtime] state_dir.
# project = "~/delivery-platform/projects/PILOT.toml"

[identity]
# Your stable Jira account ID (not your display name or email).
# Find it with `delivery credentials check` once the token is stored.
developer_jira_account_id = "YOUR_ACCOUNT_ID"
# Names this registered machine. Only one supervisor per Jira identity may run.
worker_id = "my-laptop"

[jira]
base_url = "https://your-site.atlassian.net"
project_key = "PILOT"
supported_issue_types = ["Story", "Task", "Bug"]
# Set to an opt-in label such as "agent-enabled" when sharing an existing project.
# Empty means project + status + assignee filters only (dedicated pilot project).
required_label = ""
# site_api_token: Basic auth with your Atlassian email + API token against base_url.
# scoped_api_token: scoped token via the Atlassian API gateway (also set cloud_id).
auth_profile = "site_api_token"
# Never put the token in this file. On macOS, store it once in the Keychain with
# `delivery credentials set --config <this file>`; it is read from there on every run.
# Elsewhere (or to override), export the environment variables named below.
email = "you@example.com"
token_keychain_service = "delivery-jira"
email_env = "JIRA_EMAIL"
token_env = "JIRA_API_TOKEN"
# cloud_id = ""
# Linked tickets give Claude context. Only links within this project are read, plus these
# projects; a link into any other project is left out.
# linked_projects = ["PLATFORM"]

[jira.attachments]
# Ticket attachments (designs, screenshots, PDFs) are downloaded by the coordinator and given
# to Claude as read-only inputs for refinement, planning, development and verification.
# Only these types are ever handed over (SVG, HTML, archives and executables never are).
enabled = true
max_file_mb = 20
max_total_mb = 100
file_types = ["png", "jpg", "jpeg", "gif", "webp", "pdf", "txt", "md", "csv", "json"]

[jira.fields]
# Single-select "Delivery resume stage" custom field from the workflow setup.
# `delivery workflow inspect` prints the ID. Leave unset to rely on coordinator
# validation only (the Jira UI then cannot hide wrong resume actions).
# resume_stage = "customfield_10050"

[repository]
url = "https://github.com/your-org/your-app.git"
base_branch = "main"
# Your normal clone. The coordinator never edits it; it creates managed worktrees.
checkout_path = "~/src/your-app"
# Managed worktrees, one per run. Must be outside the checkout.
worktree_root = "~/delivery-worktrees"
github_auth_profile = "gh"
# Sign the coordinator's commits with your own Git signing setup (user.signingkey,
# gpg.format). Needed when the base branch requires signed commits; `delivery doctor` says so.
# sign_commits = false
# Run the repository's Git hooks (pre-commit, commit-msg) on the coordinator's commits. They run
# as you, outside Claude's sandbox, like the checks. Off: hooks are skipped.
# run_git_hooks = false

[runtime]
# Local recovery journal, logs and locks. Must be outside any Git checkout.
state_dir = "~/.local/state/delivery"
poll_seconds = 60
poll_jitter_seconds = 10
# Per Claude session timeout, and per check command timeout.
timeout_seconds = 1800
check_timeout_seconds = 1800
heartbeat_seconds = 30
# New sessions wait (running ones carry on) while the disk holding worktree_root has less free
# space than this (0: not checked), or macOS reports critical memory pressure.
# min_free_disk_gb = 5
# hold_on_memory_pressure = true
# Keep the Mac from idle sleep while sessions run. Closing the lid still sleeps it; work
# interrupted that way resumes afterwards.
# keep_awake = true
# Local logs and worktrees of runs finished longer ago than this are removed once a day
# (Jira and Git keep the durable record). 0: keep them until `coordinator clean`.
# retention_days = 30

[claude]
executable = "claude"
# The delivery plugin. Default: plugins/delivery in this installation (leave it unset).
# plugin_path = "/path/to/delivery-platform/plugins/delivery"
# Only the local Claude Code subscription login is supported. No API billing.
auth_profile = "subscription"
max_turns = 150
allow_paid_api_fallback = false
permission_profile = "local_pilot"
# Claude Code updates itself. When `claude --version` is not the version the sandbox probe last
# passed on here (`delivery doctor --claude-probe` records it), new sessions wait while the
# coordinator runs that probe again, and start once it passes.
# probe_on_version_change = true
# Model for every procedure. Unset means Claude Code's own default for your plan.
# Aliases ("opus", "sonnet") or full names ("claude-opus-5-5") both work.
# model = "sonnet"

# Model for `coordinator help <KEY>`, the Claude session that works out what is wrong with a
# ticket. Default: "opus".
# help_model = "opus"

# Optional per-procedure overrides; anything not listed uses `model` above.
# Procedures: refine-ticket, plan-ticket, implement-ticket, review-ticket,
# verify-ticket, resolve-conflicts, investigate-ticket, resolve-blocker.
# `delivery doctor --claude-probe` checks every configured model works for you.
# [claude.models]
# plan-ticket = "opus"
# implement-ticket = "opus"
# review-ticket = "opus"

# Turn and time limits per session. Defaults: 150 turns (500 for implement-ticket, 250 for
# verify-ticket, 200 for review-ticket) and runtime.timeout_seconds (120 minutes for
# implement-ticket, 60 for verify-ticket, 45 for review-ticket). These are backstops: the
# guardrails below stop a session that loops or stalls long before them.
# [claude.turn_limits]
# implement-ticket = 800
# [claude.timeout_minutes]
# implement-ticket = 180

# [claude.guardrails]
# loop_repeats = 6     # same step with the same result this many times in its last 30 steps
# stall_minutes = 15   # no activity in the session log for this long

# Watch Claude work and type to it: each session runs as a normal interactive `claude` in tmux
# (brew install tmux) with the same restrictions, and a terminal window opens on it.
[claude.interactive]
enabled = true
# window = "Terminal"       # or "iTerm", or "none" (then: delivery attach <ticket>)
# keep_open = true          # a development session stays open for questions after handing
#                           # over the result; changes you ask for there are pushed as a new
#                           # candidate (the ticket returns to Ready for verification).
#                           # Verification waits until you end it (/exit), so it runs once on
#                           # the final candidate. Other sessions close at hand-off regardless
# idle_close_hours = 12

[approvals]
# Jira account IDs of the people who may approve, accept, answer and resume. Leave it
# empty to let anyone who can comment on and move the ticket decide (nothing waits for
# one person); a decision always needs the exact token and a human, never automation.
jira_account_ids = []
# Humans whose GitHub review satisfies the code gate (never the PR author).
github_logins = ["human-reviewer"]
require_independent_github_review = true

[release]
profile = "local_pilot"
environment = "local-pilot"
human_merge_required = true
human_deployment_required = true
# The release is the PR merge: Accept delivery moves the ticket to Ready for release, you merge
# the PR, and the coordinator moves the ticket to Done once it sees the merge.

[checks]
# Run once in every fresh worktree before the checks below.
setup = ["npm", "ci"]

[checks.commands]
# Coordinator-run gates. Argument lists, never shell strings.
lint = ["npm", "run", "lint"]
typecheck = ["npm", "run", "typecheck"]
unit = ["npm", "run", "test:unit"]
build = ["npm", "run", "build"]
e2e = ["npm", "run", "test:e2e"]

[checks.ci]
required_names = ["lint", "typecheck", "unit", "build", "e2e"]
expected_producer = "github-actions"
allow_neutral = []
allow_skipped = []

[workflow.statuses]
# Actual Jira status IDs, filled in by `delivery setup` or generated with
#   delivery workflow inspect --config <this file>
# Every status in the setup instructions is required before `delivery run`.
# Keys, each set to that status's numeric Jira ID in quotes (e.g. backlog = "10001"):
#   backlog, ready_refinement, refining, specification_review,
#   ready_planning, planning, plan_review,
#   ready_development, developing,
#   ready_verification, verifying, code_review, acceptance_review,
#   changes_requested, needs_clarification, blocked,
#   ready_release, done, cancelled
# Optional (a developer-attended session that clears a blocker): ready_resolution, resolving

[workflow.actions]
# Transition names. Defaults match the setup instructions; override only if your
# workflow uses different names. Transition IDs are resolved per issue at runtime.
# submit_refinement = "Submit for refinement"
# approve_specification = "Approve specification"

[overlap]
# Optional component map in the application repository (base branch).
component_map_path = "docs/architecture/components.toml"
low_signal_paths = ["package-lock.json", "uv.lock", "CHANGELOG.md"]

[figma]
# Figma frames linked in a ticket description ("Copy link to selection" in Figma) are
# snapshotted by the coordinator (PNG render, copy/typography/colour summary, layer data)
# and given to Claude read-only. Claude never talks to Figma. Store a Figma personal access
# token (scopes: File content read-only, Current user read) once with
# `delivery credentials set figma`; without one, links are listed to Claude as skipped.
enabled = true
image_scale = 2      # render scale, 0.5-4
max_frames = 10      # frames per ticket
max_image_mb = 20

# Try the change in your browser. Once a development session has handed over its candidate (and
# stays open, see [claude.interactive]), the coordinator runs the app from that session's
# worktree and opens it; changes you then ask for in the session show up there (with a dev
# server that reloads). When one of your tickets reaches Acceptance review, it runs the
# code-approved candidate the same way until the ticket leaves Acceptance review. Anyone with
# this config can run a ticket's candidate with `delivery try <ticket>`. `delivery preview
# <ticket>` reopens a running app.
[preview]
command = ["npm", "run", "dev"]   # "{port}" is replaced by its port, also exported as PORT
# setup = ["npm", "ci"]             # run first; default checks.setup, [] for nothing
# seed = ["npm", "run", "seed"]     # run after setup, before the app (demo data); default nothing
# url = "http://localhost:{port}/"
# open_browser = true
# acceptance = true                 # run the candidate during Acceptance review

# How kinds of work move through the stages.
# [flow]
# resolve_conflicts = true          # development merges the latest base; Claude resolves conflicts
# bug_types = ["Bug"]               # reproduce first: failing regression test, checked on the base
# reproduce_check = "unit"          # the check that runs a bug's regression tests on the base branch
# spike_types = ["Spike"]           # findings instead of a plan; needs the Complete spike transition
# fast_track_label = "fast-track"   # plan written and approved with the specification; needs the
#                                   # Use approved plan transition ("" turns it off)
# link_type = "Relates"             # how CREATE TICKETS links new tickets to the one proposing them

# Reminder comments on your tickets that have waited long for a person (a review, answers, a
# blocker, the merge). Jira notifies the ticket's watchers; listed approvers are mentioned.
# [reminders]
# after_hours = 24                  # 0: no reminders
# repeat_hours = 24
# max_reminders = 3
# weekdays_only = true
# webhook_env = "DELIVERY_SLACK_WEBHOOK"   # optional: also post to this Slack incoming webhook URL
#                                          # (default: [notifications] webhook_env)

# Notices about the coordinator itself rather than a ticket.
# [notifications]
# "jira": Claude's login or usage limit and internal coordinator errors are also commented on
# the affected ticket. "operator": they only go to the coordinator window, a desktop
# notification and the webhook, so tickets a client reads carry nothing about your machine.
# operational = "jira"
# Environment variable holding a Slack (or compatible) incoming-webhook URL for those notices
# and for alerts: the coordinator stopped unexpectedly or hit an internal error, Claude Code
# changed and failed its probe, the machine is short of disk or memory.
# webhook_env = "DELIVERY_ALERTS_WEBHOOK"
# desktop = true                    # the same alerts as macOS notifications
